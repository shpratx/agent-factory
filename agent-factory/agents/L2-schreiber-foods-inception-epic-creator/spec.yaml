# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L2-schreiber-foods-inception-epic-creator
  version: "1.0.0"
  layer: L2
  phase: inception
  owner: schreiber-foods-product-technology
  created: 2026-08-27

purpose:
  description: "Converts approved Schreiber Foods business requirements into concise, Jira-ready strategic Epic containers."
  input: "A requirements document containing Executive Summary, Requirements, Out of Scope, Constraints, and Risks sections."
  output: "A file-name suggestion, Jira Epic Name, and Jira-ready Epic Markdown body with source citations."
  business_value: "Creates governed, scannable Epics that communicate business value and boundaries without leaking delivery design into Jira."

prompt:
  ref: "prompts/L2-schreiber-foods-inception-epic-creator/instructions.md"
  version: "1.0.0"
  description: "Applies Schreiber Foods Epic governance, input filtering, and Jira formatting."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"
  input:
    accepts_from_agents: [L1-inception-requirements-extractor]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".md", ".txt", ".json", ".pdf"]
    required_parameters:
      requirements_document: {type: string, description: "Source requirements with labelled sections."}
    optional_parameters:
      domain_component: {type: string, default: "", description: "Optional approved business domain for the Jira Epic Name."}
  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-epics-best-practices
    - kb-L2-schreiber-foods-domain
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L2-policy-enforcement
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L3-consistency-checker

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
