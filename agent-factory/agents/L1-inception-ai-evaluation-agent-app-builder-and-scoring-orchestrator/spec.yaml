# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-inception-ai-evaluation-agent-app-builder-and-scoring-orchestrator
  version: "1.0.0"
  layer: L1
  phase: inception
  owner: agentic-ai-coe
  created: 2026-07-07

purpose:
  description: "Designs and operationalizes a production-ready AI evaluation application specification covering scoring logic, UI screens, data models, reliability controls, and security requirements"
  input: "A task definition, evaluation requirements, output type, difficulty, failure modes, and desired product scope"
  output: "A complete enterprise-ready specification for an AI evaluation application with blueprint, scoring logic, schema, UI guidance, reliability controls, security notes, and delivery checklist"
  business_value: "Helps engineering and product teams rapidly define a secure, testable, and scalable AI evaluation experience without starting from scratch"

prompt:
  ref: "prompts/L1-inception-ai-evaluation-agent-app-builder-and-scoring-orchestrator/instructions.md"
  version: "1.0.0"
  description: "Produces a structured app specification for an AI output evaluation workflow"

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [any]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".md", ".txt", ".json", ".pdf"]
    required_parameters:
      task_definition: {type: string, description: "Task description including task name, description, success criteria, failure modes, output type, and difficulty"}
    optional_parameters:
      domain: {type: string, default: "general", description: "Optional domain context for the evaluation use case"}
      constraints: {type: array, description: "Optional implementation constraints or organizational requirements"}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-enterprise-architecture
    - kb-L1-epics-best-practices
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L3-consistency-checker
  tools: []

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
