# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-inception-epic-creator-agent
  version: "1.0.0"
  layer: L1
  phase: inception
  owner: agentic-ai-coe
  created: 2026-07-30

purpose:
  description: "Converts an approved roadmap and vision into a complete, non-overlapping set of epics"
  input: "roadmap.md (Product-Lead approved) and vision.md (viability score >= 7) from upstream planning/vision agents"
  output: "Epics with full traceability to roadmap/vision, deduplicated against existing tracker issues"
  business_value: "Transforms an approved roadmap into a plannable epic backlog that downstream feature/story/task agents can decompose"

prompt:
  ref: "prompts/L1-inception-epic-creator-agent/instructions.md"
  version: "1.0.0"
  description: "Generates epics from roadmap + vision with grounding, dedupe, and reflection"

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-planning-sprint-planner-agent, L1-vision-statement-generator-agent]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".md", ".json"]
    required_parameters:
      roadmap: {type: object, description: "roadmap.md content with approval metadata (approval.status must be 'approved')"}
      vision: {type: object, description: "vision.md content with phase_1_gate.viability_score >= 7"}
    optional_parameters:
      max_epics: {type: integer, default: 12, description: "Maximum number of epics to generate"}
      dedupe_scope: {type: string, default: "project", description: "Scope for tracker dedupe check: project | program | portfolio"}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-sdlc-templates          # Standard epic structure/format conventions
    - kb-L1-enterprise-security     # PII/sensitive-content definitions for reflection + guardrail checks
  tools:
    - tool-L1-jira-fetch-issue      # Live fetch of existing epics for dedupe, called every run
  guardrails:
    - gr-L1-schema-validator
    - gr-L1-pii-detection
    - gr-L1-hallucination-check
    - gr-L2-payments-compliance

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

human_gate:
  required: true
  reviewer: "Product Lead"
  reviews: ["open_questions", "gate_failure_history"]
  blocks: "L1-inception-feature-decomposer-agent (A2) until this gate + human review pass"

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
