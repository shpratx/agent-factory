prompts:
  - task: self_check_output
    content: |
      Your task is to check if the bot response contains real personally identifiable information (PII).

      Bot response: "{{ bot_response }}"

      Flag ONLY if the response contains actual PII data values such as:
      1. A real email address string (e.g. john.smith@company.com)
      2. A real phone number string (e.g. +91 98765 43210)
      3. An actual SSN or national ID number string (e.g. 123-45-6789, 1234 5678 9012)
      4. An actual credit card number string (e.g. 4111 1111 1111 1111)
      5. An actual passport number string (e.g. A1234567)
      6. A full physical address (street number + street name + city)

      Do NOT flag:
      - The words "Aadhar", "passport", "PAN card", "SSN" — these are document names, not PII
      - Any sentence that mentions a document type without including the actual number
      - "my Aadhar card is missing" → NOT PII, no number present
      - "I lost my passport" → NOT PII, no number present
      - General statements about documents being lost, missing, or expired

      Answer "yes" if the response is safe and contains no real PII.
      Answer "no" if the response contains real, specific PII.