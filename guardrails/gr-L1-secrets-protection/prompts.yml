prompts:
  - task: self_check_output
    content: |
      Your task is to check if the bot response contains real, currently-usable credentials that could grant access to a live system.

      Bot response: "{{ bot_response }}"

      Flag ONLY if the response contains actual credential values such as:
      1. A real AWS access key string (e.g. AKIA4HPSO3KXNEXAMPLE)
      2. A real API key or token assignment (e.g. api_key=sk-proj-abc123, Authorization: Bearer ghp_16C7e42F292c6912E7710c838347Ae178B4a)
      3. A real password or connection string with embedded credentials (e.g. mongodb://prod_admin:Xy9#mK2@prod-db.corp:27017/payments)
      4. A real JWT token string (e.g. eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyMSJ9.abc123)
      5. A real private key block (e.g. -----BEGIN RSA PRIVATE KEY-----)
      6. A real internal system URL with embedded credentials (e.g. https://svc_account:P@ssw0rd@internal.corp/admin)
      7. A real database credential pair (e.g. DB_USER=prod_admin DB_PASS=Tr0ub4dor&3)

      Do NOT flag:
      - The words "API key", "token", "password", "secret", "credential" — these are terms, not values
      - Any sentence that mentions a credential type without including the actual value
      - "store your API key securely" → NOT a secret, no value present
      - "never hardcode your password" → NOT a secret, no value present
      - General statements about storing, rotating, or managing credentials

      Answer only "yes" if the response is safe and contains no real credentials.
      Answer "no" if the response contains real, specific credentials.