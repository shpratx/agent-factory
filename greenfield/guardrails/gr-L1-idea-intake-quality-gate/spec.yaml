spec_version: "1.0"
artifact_type: guardrail
metadata:
  name: gr-L1-idea-intake-quality-gate
  version: "1.0.0"
  layer: L1
  owner: agentic-ai-coe
  implementation: colang

purpose:
  description: "Fires when L1-vision-idea-intake-evaluator concludes. Validates the RESULTANT output — L1-vision-idea-intake's own items, with the evaluator's fixes_applied resolved in — against L1-vision-idea-intake/output_schema.json and L1-vision-idea-intake/evaluation.md's rubric. This is a gate on the content that actually flows to L1-vision-market-analyzer / L1-vision-regulatory-feasibility-checker, not on the evaluator's own scoring bookkeeping."

triggers_on:
  - post_execution   # fires when the evaluator (not the generator) finishes — evaluation is concluded, resultant content is final

on_fail: retry_once_then_escalate
applies_to: configured_agents   # wired into L1-vision-idea-intake-evaluator/spec.yaml context.guardrails — not global

rules:
  # --- Output schema validation (of L1-vision-idea-intake's own output_schema.json) ---
  - name: schema-compliance
    description: "The resultant items (generator_output.content.items, with fixes_applied resolved in) must validate against L1-vision-idea-intake/output_schema.json: problem_statement/value_proposition (statement, confidence, reasoning, traced_to), target_users[] (id TU-NN, statement, confidence, reasoning, traced_to), candidate_success_metrics[] (id SM-NN, metric, status stated|suggested, confidence, reasoning), open_questions[] (id OQ-NN, question, reasoning)"
    action: block
    severity: critical

  - name: ids-sequential-no-gaps
    description: "TU-NN, SM-NN, OQ-NN ids are each sequential within their category with no gaps or duplicates (evaluation.md Quality Gate #4)"
    action: block
    severity: high

  - name: insufficient-context-integrity
    description: "If L1-vision-idea-intake's own status was 'failed' (INSUFFICIENT_CONTEXT), items must be empty and execution_summary must state INSUFFICIENT_CONTEXT — never a hallucinated partial brief (evaluation.md Quality Gate #5)"
    action: block
    severity: critical

  # --- Rubric adherence (evaluation.md, checked against the RESULTANT content) ---
  - name: traced-to-grounded
    description: "Every item's traced_to must be an actual substring or clear paraphrase of the ORIGINAL idea_brief_text — not fabricated (evaluation.md Quality Gate #2). Did the evaluator's fixes, if any, preserve this rather than introduce an ungrounded traced_to?"
    action: flag
    severity: high

  - name: success-metric-status-correct
    description: "Every candidate_success_metrics[].status is correctly 'stated' (explicit in input) vs. 'suggested' (inferred) — no mislabeling that would let a suggested target be mistaken for a stated fact (evaluation.md Quality Gate #3, Reflection Checklist #2)"
    action: flag
    severity: high

  - name: no-placeholder-or-vague-filler
    description: "No field in the resultant output is placeholder or vague filler text (evaluation.md Reflection Checklist #1)"
    action: flag
    severity: medium

evaluation:
  false_positive_threshold: 0.05
