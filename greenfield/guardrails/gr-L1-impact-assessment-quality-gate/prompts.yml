models:
    type: main
    engine: openai
    model: gpt-5.4


rails:
  output:
    flows:
      - self check output

prompts:
  - task: self_check_output
    content: |
      Your task is to check if the bot response (resultant impact-assessment content) passes every Quality Gate checklist item and every rubric score threshold below.

      Bot response: "{{ bot_response }}"

      First, check status. If status is "failed" with reason "INSUFFICIENT_CONTEXT", this is a legitimate refusal — treat it as safe and skip the checks below.

      Otherwise, flag ONLY if the response fails any of these Quality Gates:
      1. Capability check genuinely run against service_catalog, not skipped — names the closest candidate service even when it is not a duplicate, never "no similar service found" with nothing checked.
      2. Every CMDB CI relevant to a proposed component is checked and cross-referenced against kb-L1-enterprise-architecture's narrative — a mismatch between what the CMDB shows and what the KB claims is flagged as a finding, never silently resolved by picking one source.
      3. Every FR in prd.md is mapped to a component with a stated blast-radius rationale (Low/Medium/High) — no FR silently unmapped.
      4. external_dependencies includes anything newly surfaced by the capability/technical-touch checks, not just what the PRD already named.
      5. A genuinely empty service_catalog/cmdb_export (no parent enterprise) is stated explicitly as such, never confused with an unchecked or skipped catalog/CMDB.
      6. Faithfulness below 0.90 — an item does not trace to a real prd.md requirement, service_catalog entry, or CMDB CI.
      7. Hallucination above 0.10 — an invented service, CI, or dependency absent from the input sources.
      8. Consistency below 0.90 — existing_system_impact disagrees with kb-L1-enterprise-architecture, or two components contradict on the same requirement.
      9. Relevance below 0.85 — the output is not usable as-is by L1-planning-dependency-mapper and L1-planning-backlog-prioritizer.
      10. Reasoning quality below 0.80 — a rationale or how_or_why_not merely restates the finding instead of explaining it.
      11. Any service in service_catalog.services[] not genuinely checked, or assumed clear without checking.
      12. Any relevant CI in cmdb_export skipped as "probably not relevant" instead of genuinely checked.
      13. Any CMDB/KB disagreement silently reconciled instead of flagged.
      14. "No existing internal systems affected" conflated with "no external dependencies" instead of both sections being independently populated.

      Do NOT flag:
      - status "failed" with reason "INSUFFICIENT_CONTEXT" — this is a legitimate refusal, not a defect.
      - matched_service_id being null when service_catalog is genuinely empty and stated as such.
      - existing_system_impact[] being empty when service_catalog and cmdb_export are both genuinely empty and stated as such.
      - blast_radius values that are exactly "Low", "Medium", or "High" with a stated rationale.

      Answer only "yes" if the response passes every Quality Gate and every rubric threshold above.
      Answer "no" if the response fails any Quality Gate or falls below any rubric threshold.