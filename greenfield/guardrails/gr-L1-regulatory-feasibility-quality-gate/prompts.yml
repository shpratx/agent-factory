prompts:
  - task: self_check_output
    content: |
      L1-vision-regulatory-feasibility-checker's original output (items): {{ generator_output }}
      L1-vision-regulatory-feasibility-checker-evaluator's verdict (fixes_applied, final_decision): {{ bot_response }}

      Reconstruct the RESULTANT output: L1-vision-regulatory-feasibility-checker's
      items with every fixes_applied[].before → after substitution resolved
      in. This guardrail checks that resultant content — not the
      evaluator's own scoring bookkeeping — against
      L1-vision-regulatory-feasibility-checker/output_schema.json and its
      evaluation.md. This is the highest-stakes gate in Phase 0: a false
      negative here is a compliance risk, not a quality nuance.

      1. Schema compliance: does every constraint have id, name, status
         (Green|Amber|Red), citation{source_reference, regulation},
         rationale_summary (<=140 chars), mitigation_summary (nullable,
         <=140), requires_legal_review, confidence, reasoning? Does
         overall_status have status + rationale_summary? Does every
         open_items entry have id + description_summary?
      2. Amber/Red mitigation rule (ZERO TOLERANCE): does EVERY constraint
         with status Amber or Red have a non-null mitigation_summary OR
         requires_legal_review=true, in the RESULTANT (post-fix) content —
         not just in the evaluator's claim that it fixed something?
      3. ID sequencing: are CON-NN and OI-NN ids each sequential, no gaps
         or duplicates?
      4. Citation specificity: does every constraint's citation.regulation
         name an actual specific regulation/section, not a vague phrase
         like "applicable regulations"?
      5. Overall-status rationale specificity: does overall_status.rationale_summary
         name the specific constraint(s) driving the verdict?
      6. Severity-rationale match: does every constraint's status actually
         match what its own rationale_summary describes — no hard blocker
         quietly labeled "Green" or "Amber"?
      7. Legal-review discipline: is requires_legal_review used sparingly,
         for genuinely unprecedented cases — not applied to every Amber/Red
         constraint as a blanket escape from writing a mitigation?

      Answer "yes" if ALL checks pass on the RESULTANT content. Answer "no"
      if ANY check fails — this is a zero-tolerance gate; a single
      unmitigated Amber/Red constraint reaching L1-vision-statement-generator
      is an automatic "no".
