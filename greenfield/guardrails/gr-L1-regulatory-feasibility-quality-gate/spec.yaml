spec_version: "1.0"
artifact_type: guardrail
metadata:
  name: gr-L1-regulatory-feasibility-quality-gate
  version: "1.0.0"
  layer: L1
  owner: agentic-ai-coe
  implementation: colang

purpose:
  description: "Fires when L1-vision-regulatory-feasibility-checker-evaluator concludes. Validates the RESULTANT output — L1-vision-regulatory-feasibility-checker's own items, with the evaluator's fixes_applied resolved in — against L1-vision-regulatory-feasibility-checker/output_schema.json and its evaluation.md rubric. Highest-stakes gate in the Phase 0 pipeline: a false negative here (an unmitigated Red constraint reaching L1-vision-statement-generator) is a compliance risk, not a quality nuance."

triggers_on:
  - post_execution   # fires when the evaluator (not the generator) finishes

on_fail: retry_once_then_escalate
applies_to: configured_agents   # wired into L1-vision-regulatory-feasibility-checker-evaluator/spec.yaml context.guardrails — not global

rules:
  # --- Output schema validation (of L1-vision-regulatory-feasibility-checker's own output_schema.json) ---
  - name: schema-compliance
    description: "The resultant items must validate against L1-vision-regulatory-feasibility-checker/output_schema.json: constraints[] (id CON-NN, name, status Green|Amber|Red, citation{source_reference, regulation}, rationale — full text, no length cap, mitigation nullable — full text, no length cap, requires_legal_review bool, confidence, reasoning), overall_status (status, rationale — full text, no length cap), open_items[] (id OI-NN, description — full text, no length cap)"
    action: block
    severity: critical

  - name: amber-red-mitigation-or-legal-review
    description: "Every constraint with status Amber or Red must have a non-null mitigation OR requires_legal_review=true, RE-CHECKED on the RESULTANT content (post-fix) — the schema's own allOf conditional, independently re-verified. A constraint the evaluator claims to have fixed but which still fails this in the resultant output is a violation, zero exceptions (evaluation.md Quality Gate #3, Reflection Checklist rule)"
    action: block
    severity: critical

  - name: ids-sequential-no-gaps
    description: "CON-NN and OI-NN ids are each sequential within their category, no gaps or duplicates (evaluation.md Quality Gate #5)"
    action: block
    severity: high

  # --- Rubric adherence (evaluation.md, checked against the RESULTANT content) ---
  - name: citation-specificity
    description: "Every constraint's citation.regulation names a specific regulation/section — not a generic phrase like 'applicable regulations' or 'relevant law' (evaluation.md Quality Gate #2, Citation completeness = 1.00, the one hard-gated agent)"
    action: block
    severity: critical

  - name: overall-status-rationale-specific
    description: "overall_status.rationale references the specific constraint(s) driving the verdict, not a vague summary (evaluation.md Quality Gate #4)"
    action: flag
    severity: high

  - name: no-downgraded-severity
    description: "No constraint's status reads inconsistently lenient relative to its own rationale — a hard blocker described in the rationale but labeled 'Green' is a violation (evaluation.md Reflection Checklist #1). Semantic check: does severity match what the rationale actually describes?"
    action: flag
    severity: high

  - name: legal-review-not-default-escape
    description: "requires_legal_review is used only where no precedented mitigation exists, not as a default escape hatch for every Amber/Red constraint (evaluation.md Reflection Checklist #2)"
    action: flag
    severity: medium

evaluation:
  false_positive_threshold: 0.03
