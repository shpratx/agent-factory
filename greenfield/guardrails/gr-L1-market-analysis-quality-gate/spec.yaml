spec_version: "1.0"
artifact_type: guardrail
metadata:
  name: gr-L1-market-analysis-quality-gate
  version: "1.0.0"
  layer: L1
  owner: agentic-ai-coe
  implementation: colang

purpose:
  description: "Fires when L1-vision-market-analyzer-evaluator concludes. Validates the RESULTANT output — L1-vision-market-analyzer's own items, with the evaluator's fixes_applied resolved in — against L1-vision-market-analyzer/output_schema.json and L1-vision-market-analyzer/evaluation.md's rubric, with 100% citation coverage as the primary check. This is a gate on the content that flows to L1-vision-statement-generator, not on the evaluator's own scoring bookkeeping."

triggers_on:
  - post_execution   # fires when the evaluator (not the generator) finishes

on_fail: retry_once_then_escalate
applies_to: configured_agents   # wired into L1-vision-market-analyzer-evaluator/spec.yaml context.guardrails — not global

rules:
  # --- Output schema validation (of L1-vision-market-analyzer's own output_schema.json) ---
  - name: schema-compliance
    description: "The resultant items must validate against L1-vision-market-analyzer/output_schema.json: competitor_matrix[] (id CM-NN, name, positioning_summary/strengths_summary/weaknesses_summary <=100 chars, citation{source_reference, retrieved_date}, confidence, reasoning), swot.{strengths,weaknesses,opportunities,threats}[] (id ST/WK/OP/TH-NN, summary <=100, confidence, reasoning), data_sufficiency (status sufficient|insufficient, rationale_summary)"
    action: block
    severity: critical

  - name: ids-sequential-no-gaps
    description: "CM-NN and each SWOT quadrant's ids are sequential within their category, no gaps or duplicates (evaluation.md Quality Gate #5)"
    action: block
    severity: high

  # --- Rubric adherence (evaluation.md, checked against the RESULTANT content) ---
  - name: citation-completeness-100pct
    description: "Every competitor_matrix[] entry has a non-empty citation with BOTH source_reference AND retrieved_date — 100% required, this is a BLOCKER not a soft score (evaluation.md Quality Gate #2, Citation completeness >= 0.95 / effectively a hard gate). A resultant entry missing either field, even after the evaluator's fixes, is a violation"
    action: block
    severity: critical

  - name: swot-reasoning-specific
    description: "Every SWOT item's reasoning names a specific competitor_matrix id or idea-brief fact, not generic filler unconnected to a specific entry (evaluation.md Quality Gate #3, Reflection Checklist #2)"
    action: flag
    severity: high

  - name: data-sufficiency-honest
    description: "data_sufficiency.status is 'insufficient' (not fabricated coverage) when the underlying evidence was genuinely thin — the rationale_summary must be honest, not padded to look thorough (evaluation.md Quality Gate #4, Reflection Checklist #3)"
    action: flag
    severity: medium

evaluation:
  false_positive_threshold: 0.05
