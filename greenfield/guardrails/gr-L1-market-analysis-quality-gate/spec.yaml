spec_version: "1.0"
artifact_type: guardrail
metadata:
  name: gr-L1-market-analysis-quality-gate
  version: "1.0.0"
  layer: L1
  owner: agentic-ai-coe
  implementation: colang

purpose:
  description: "Fires when L1-vision-market-analyzer-evaluator concludes. Validates the RESULTANT output — L1-vision-market-analyzer's own items across all five dimensions (competitor_matrix, market_sizing, industry_trends, customer_insights, pricing_benchmarks, swot), with the evaluator's fixes_applied resolved in — against L1-vision-market-analyzer/output_schema.json and L1-vision-market-analyzer/evaluation.md's rubric, with 100% citation coverage across every citation-bearing field as the primary check. This is a gate on the content that flows to L1-vision-statement-generator, not on the evaluator's own scoring bookkeeping."

triggers_on:
  - post_execution   # fires when the evaluator (not the generator) finishes

on_fail: retry_once_then_escalate
applies_to: configured_agents   # wired into L1-vision-market-analyzer-evaluator/spec.yaml context.guardrails — not global

rules:
  # --- Output schema validation (of L1-vision-market-analyzer's own output_schema.json) ---
  - name: schema-compliance
    description: "The resultant items must validate against L1-vision-market-analyzer/output_schema.json: competitor_matrix[] (id CM-NN, name, positioning/strengths/weaknesses — full text, no length cap, citation{source_reference, retrieved_date}, confidence, reasoning), market_sizing.{tam,sam,som} (value, basis — full text, no length cap, confidence, reasoning, citation{source_reference, retrieved_date}), industry_trends[] (id TR-NN, statement — full text, no length cap, direction growing|declining|stable|emerging, confidence, reasoning, citation), customer_insights[] (id CI-NN, insight — full text, no length cap, segment, confidence, reasoning, citation), pricing_benchmarks[] (id PB-NN, subject, price_point — full text, no length cap, model commission|subscription|listing_fee|transaction_fee|other, confidence, reasoning, citation), swot.{strengths,weaknesses,opportunities,threats}[] (id ST/WK/OP/TH-NN, statement — full text, no length cap, confidence, reasoning), data_sufficiency (status sufficient|insufficient, rationale — full text, no length cap)"
    action: block
    severity: critical

  - name: ids-sequential-no-gaps
    description: "CM-NN, TR-NN, CI-NN, PB-NN, and each SWOT quadrant's ids are sequential within their category, no gaps or duplicates (evaluation.md Quality Gate #8)"
    action: block
    severity: high

  # --- Rubric adherence (evaluation.md, checked against the RESULTANT content) ---
  - name: citation-completeness-100pct
    description: "Every competitor_matrix[], market_sizing.{tam,sam,som}, industry_trends[], customer_insights[], and pricing_benchmarks[] entry has a non-empty citation with BOTH source_reference AND retrieved_date — 100% required across all five citation-bearing dimensions, this is a BLOCKER not a soft score (evaluation.md Quality Gate #2-4, Citation completeness >= 0.95 / effectively a hard gate). A resultant entry missing either field, even after the evaluator's fixes, is a violation — including a low-confidence gap-flagging market_sizing entry, which must still cite what was consulted and came up empty"
    action: block
    severity: critical

  - name: swot-reasoning-specific
    description: "Every SWOT item's reasoning names a specific competitor_matrix id, industry_trends/customer_insights entry, or idea-brief fact, not generic filler unconnected to a specific entry (evaluation.md Quality Gate #5, Reflection Checklist #2)"
    action: flag
    severity: high

  - name: no-fabricated-figures
    description: "No market_sizing value, industry_trends statement, customer_insights insight, or pricing_benchmarks price_point is a plausible-sounding invention with no real citation — a genuine data gap must be an explicit low-confidence entry with reasoning stating the gap, or an empty array, never a fabricated figure (evaluation.md Quality Gate #6)"
    action: block
    severity: critical

  - name: data-sufficiency-honest
    description: "data_sufficiency.status is 'insufficient' (not fabricated coverage) when the underlying evidence was genuinely thin, and the rationale names which of the five dimensions were thin — not padded to look uniformly thorough (evaluation.md Quality Gate #6, Reflection Checklist #3)"
    action: flag
    severity: medium

evaluation:
  false_positive_threshold: 0.05
