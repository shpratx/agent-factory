prompts:
  - task: self_check_output
    content: |
      L1-vision-market-analyzer's original output (items): {{ generator_output }}
      L1-vision-market-analyzer-evaluator's verdict (fixes_applied, final_decision): {{ bot_response }}

      Reconstruct the RESULTANT output: L1-vision-market-analyzer's items
      with every fixes_applied[].before → after substitution resolved in.
      This guardrail checks that resultant content — not the evaluator's
      own scoring bookkeeping — against
      L1-vision-market-analyzer/output_schema.json and
      L1-vision-market-analyzer/evaluation.md:

      1. Schema compliance: does every competitor_matrix[] entry have id,
         name, positioning/strengths/weaknesses (full text, no length cap),
         citation{source_reference, retrieved_date}, confidence, reasoning?
         Does market_sizing have tam/sam/som, each with value, basis (full
         text, no length cap), confidence, reasoning, citation? Does every
         industry_trends[] entry have id, statement (full text, no length
         cap), direction (growing|declining|stable|emerging), confidence,
         reasoning, citation? Does every customer_insights[] entry have id,
         insight (full text, no length cap), segment, confidence, reasoning,
         citation? Does every pricing_benchmarks[] entry have id, subject,
         price_point (full text, no length cap), model (commission|
         subscription|listing_fee|transaction_fee|other), confidence,
         reasoning, citation? Does every SWOT quadrant entry have id,
         statement (full text, no length cap), confidence, reasoning? Does data_sufficiency
         have status (sufficient|insufficient) and rationale (full text, no length cap)?
      2. ID sequencing: are CM-NN, TR-NN, CI-NN, PB-NN, and each SWOT
         quadrant's ids sequential, no gaps or duplicates?
      3. Citation completeness: does EVERY competitor_matrix,
         market_sizing.{tam,sam,som}, industry_trends, customer_insights,
         and pricing_benchmarks entry have BOTH source_reference AND
         retrieved_date populated — 100% across all five citation-bearing
         dimensions, not a sample, and not left incomplete even after any
         evaluator fix? A low-confidence gap-flagging market_sizing entry
         must still cite what was consulted.
      4. SWOT specificity: does every SWOT item's reasoning name a specific
         competitor_matrix id, industry_trends/customer_insights entry, or
         idea-brief fact, not generic filler?
      5. No fabricated figures: is every market_sizing value, industry_trends
         statement, customer_insights insight, and pricing_benchmarks
         price_point traceable to its citation rather than a plausible-
         sounding invention?
      6. Data-sufficiency honesty: if status is "insufficient", is the
         rationale genuinely honest about thin coverage — naming which of
         the five dimensions were thin — not padded to look more thorough
         than it is?

      Answer "yes" if ALL checks pass on the RESULTANT content. Answer "no"
      if ANY check fails — this gates what actually flows to
      L1-vision-statement-generator.
