models:
  - type: main
    engine: openai
    model: gpt-5.4


rails:
  output:
    flows:
      - self check output

prompts:
  - task: self_check_input
    content: |
      Your task is to check if the user input contains vision statement content that fails its quality gate.

      User input: "{{ user_input }}"

      Flag ONLY if the input contains issues such as:
      1. Coverage gap: a constraint_id in regulatory_posture.constraint_summaries that appears in no open_risks entry's related_ids
      2. Untraced risk: an open_risks entry whose related_ids is missing or empty, whose source is neither regulatory nor market, or whose related_ids name an id in no recognised form (CON, ST, WK, OP, TH)
      3. Missing sections or fields: any of executive_summary, problem_statement, target_users, value_proposition, market_context, regulatory_posture, north_star_metrics, roadmap, open_risks absent, or an entry missing its own required fields
      4. Broken identifiers: NSM-NN or OR-NN ids malformed, duplicated, or not sequential from 01, or roadmap phase_number not running sequentially from 1
      5. Misordered roadmap: an open risk tracing to a Red-status constraint that the phase 1 roadmap entry does not resolve
      6. Unsupported summary: an executive_summary asserting a claim that appears in none of the sections below it
      7. Contradicted records: a summary or conclusion reporting a viability_score that differs from the one recorded, omitting it, or claiming full regulatory coverage while a constraint_id is uncovered
      8. Lost structure: sections given as narrative prose, without NSM-NN/OR-NN ids and per-entry fields

      Flag issues 1, 2, and 7 even when the input reports the problem itself, marks itself failed, or says it is escalating — describing a violation does not remove it.

      Do NOT flag:
      - Two or more related constraint_ids covered by one combined open_risks entry — coverage is set membership, never 1:1 cardinality
      - A market-sourced open risk carrying no constraint_id, or a roadmap phase with no resolves_risk
      - Short summaries, a low confidence value, or a viability_score that is simply below threshold
      - Scores, findings, fixes_applied, or a final_decision of escalate_to_hitl on their own
      - Input with no vision statement content, or an INSUFFICIENT_CONTEXT envelope that produced no sections

      Answer "yes" if the input contains a vision statement quality gate failure (should be blocked).
      Answer "no" if the input is safe (no quality gate failure found).
      Reply with one word only.

  - task: self_check_output
    content: |
      Your task is to check if the bot response contains vision statement content that fails its quality gate.

      Bot response: "{{ bot_response }}"

      Flag ONLY if the response contains issues such as:
      1. Coverage gap: a constraint_id in regulatory_posture.constraint_summaries that appears in no open_risks entry's related_ids
      2. Untraced risk: an open_risks entry whose related_ids is missing or empty, whose source is neither regulatory nor market, or whose related_ids name an id in no recognised form (CON, ST, WK, OP, TH)
      3. Missing sections or fields: any of executive_summary, problem_statement, target_users, value_proposition, market_context, regulatory_posture, north_star_metrics, roadmap, open_risks absent, or an entry missing its own required fields
      4. Broken identifiers: NSM-NN or OR-NN ids malformed, duplicated, or not sequential from 01, or roadmap phase_number not running sequentially from 1
      5. Misordered roadmap: an open risk tracing to a Red-status constraint that the phase 1 roadmap entry does not resolve
      6. Unsupported summary: an executive_summary asserting a claim that appears in none of the sections below it
      7. Contradicted records: a summary or conclusion reporting a viability_score that differs from the one recorded, omitting it, or claiming full regulatory coverage while a constraint_id is uncovered
      8. Lost structure: sections given as narrative prose, without NSM-NN/OR-NN ids and per-entry fields

      Flag issues 1, 2, and 7 even when the response reports the problem itself, marks itself failed, or says it is escalating — describing a violation does not remove it.

      Do NOT flag:
      - Two or more related constraint_ids covered by one combined open_risks entry — coverage is set membership, never 1:1 cardinality
      - A market-sourced open risk carrying no constraint_id, or a roadmap phase with no resolves_risk
      - Short summaries, a low confidence value, or a viability_score that is simply below threshold
      - Scores, findings, fixes_applied, or a final_decision of escalate_to_hitl on their own
      - A response with no vision statement content, or an INSUFFICIENT_CONTEXT envelope that produced no sections

      Answer "yes" if the response contains a vision statement quality gate failure (should be blocked).
      Answer "no" if the response is safe (no quality gate failure found).
      Reply with one word only.
