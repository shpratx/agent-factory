models:
    type: main
    engine: openai
    model: gpt-5.4


rails:
  output:
    flows:
      - self check output

prompts:
  - task: self_check_output
    content: |
      Your task is to check if the bot response contains a flawed dependency-graph quality-gate evaluation for L1-planning-dependency-mapper-evaluator's resultant output.

      Bot response: "{{ bot_response }}"

      Flag ONLY if the response contains dependency-graph quality-gate violations such as:
      1. Unverified cycle check — cycle_check.status or cycles_found is asserted without tracing an actual DFS recursion-stack back-edge detection over every node and edge, e.g. marked PASS because the graph "looks" acyclic.
      2. Unverified critical path — critical_path is asserted without an actual longest-path computation over depends-on/blocks edges only, e.g. chosen by eyeballing the longest-looking chain instead of computing it.
      3. Hidden tie — a genuine tie in longest-path length exists but only one winning chain is reported instead of naming every chain sharing the maximum length.
      4. Inconsistent edge direction — an edge's from/to does not follow the uniform rule that from is upstream/prerequisite and to is downstream/dependent, for any edge type (depends-on, blocks, or integrates-with).
      5. Missing FR coverage — an FR-NNN id from prd.md does not appear in at least one node's source_requirement, or coverage is claimed by counting nodes instead of checking set membership.
      6. Dropped component — a component or external dependency named in impact-assessment.md has no corresponding node in the graph.
      7. Malformed node id — a node id is not kebab-case (^[a-z0-9-]+$), or is duplicated across nodes.
      8. Dangling edge — an edge's from or to references a node id that does not exist among the graph's nodes.
      9. Silent cycle fix — cycle_check.status is FAIL but the overall AgentOutput status is not "failed", e.g. the offending edge is silently dropped and success reported instead of escalating.
      10. Thin rationale — critical_path.rationale merely repeats the list of node ids instead of stating the actual path length in readable prose and naming any tie.
      11. Unsupported grounding — a node, edge, or FR coverage claim is invented beyond what impact-assessment.md or prd.md actually state.
      12. Skipped reflection — the response indicates the DFS cycle check or longest-path computation was eyeballed or assumed rather than actually traced node-by-node and edge-by-edge.

      Do NOT flag:
      - integrates-with edges being excluded from the critical-path computation — this is correct, non-blocking by definition.
      - a critical_path.rationale that states the path length and any tie in different but equivalent phrasing, as long as it is not a bare node-id list.
      - a cycle_check that correctly reports PASS with a genuine, verifiable trace for an acyclic graph.
      - ties that are correctly and honestly named in full.

      Answer only "yes" if the response is safe and contains no dependency-graph quality-gate violations.
      Answer "no" if the response contains dependency-graph quality-gate violations.