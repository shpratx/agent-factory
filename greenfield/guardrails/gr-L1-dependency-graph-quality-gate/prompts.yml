prompts:
  - task: self_check_output
    content: |
      L1-planning-dependency-mapper's original output (items): {{ generator_output }}
      L1-planning-dependency-mapper-evaluator's verdict (fixes_applied, final_decision): {{ bot_response }}

      Reconstruct the RESULTANT output: L1-planning-dependency-mapper's items
      with every fixes_applied[].before -> after substitution resolved in
      (edge from/to/type corrections and critical_path.nodes/rationale
      corrections included). Check that resultant content — not the
      evaluator's own scoring bookkeeping — against
      L1-planning-dependency-mapper/output_schema.json and its evaluation.md
      rubric. Do NOT trust the resultant cycle_check or critical_path fields
      at face value — actually re-derive them yourself, step by step, exactly
      as instructed below:

      1. Schema compliance: does items have product_name, source_artifacts,
         nodes[], edges[], cycle_check, critical_path, generated,
         execution_id, workflow_execution_id? Does every node have id
         (kebab-case, unique), type (component|external-dependency), label?
         Does every edge have from, to, type (depends-on|blocks|integrates-with)?
      2. Edge endpoints: does every edge's from/to reference a node id that
         actually appears in nodes[]?
      3. Independent cycle re-check (THE MOST IMPORTANT CHECK): trace an
         actual depth-first search over every node and edge, tracking which
         nodes are currently on the recursion stack. If the traversal ever
         reaches a node still on the stack, that is a real cycle. Compare
         your own traced result against the resultant cycle_check.status —
         do they agree? If cycle_check claims PASS but you traced a real
         cycle, or claims FAIL but you found none, or the claimed
         cycles_found path doesn't match a cycle you actually traced, that
         is a violation.
      4. Cycle-status escalation: if your own DFS trace found a real cycle,
         is the overall resultant status "failed"? A cyclic graph shipped
         as status "success" is a critical violation.
      5. Independent longest-path re-check (only meaningful if your own DFS
         trace found no cycle): trace an actual longest-path walk using only
         depends-on and blocks edges (ignore integrates-with entirely) from
         every node that has no incoming depends-on/blocks edge. Sum edge
         counts along every forward walk and keep the maximum. If two or
         more walks from different roots tie at that maximum length, that is
         a genuine tie — note every tied chain. Does the resultant
         critical_path.nodes match your own longest walk (or one of the tied
         walks)? Is the claimed length actually achievable by real
         depends-on/blocks edges? If there's a tie, does critical_path.rationale
         actually name the other tied chain(s), not just describe the one
         chosen?
      6. FR coverage: collect the full set of FR-NNN ids from the original
         input's prd_output requirements. Collect the set of FR-NNN ids
         appearing across every node's source_requirement[]. Do these two
         sets match exactly (no FR silently dropped, no FR invented that
         isn't in prd.md)?
      7. Rationale quality: does critical_path.rationale genuinely state the
         computed path length and name any tie in readable prose, rather
         than just repeating the node id list?

      Answer "yes" if ALL checks pass on the RESULTANT content, using your
      own independently-traced DFS and longest-path results (not the
      resultant fields themselves) as the source of truth for checks 3-5.
      Answer "no" if ANY check fails — this gates what actually flows to
      L1-planning-backlog-prioritizer (topological-sort input) and Phase 4's
      L1-design-hld.
