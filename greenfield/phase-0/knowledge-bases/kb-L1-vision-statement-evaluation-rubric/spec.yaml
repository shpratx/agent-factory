spec_version: "1.0"
artifact_type: knowledge_base
metadata:
  name: kb-L1-vision-statement-evaluation-rubric
  version: "1.0.0"
  layer: L1
  owner: agentic-ai-coe
  content_hash: "sha256:1e8f750b9953b9845ae9d2173fcd0a1f717256ae1d4431a7df53fe357e6c9c89"
  last_reviewed: "2026-08-12"
  review_cadence: quarterly

purpose:
  description: >
    A static, non-domain rubric KB — a verbatim runtime mirror of
    L1-vision-statement-generator/evaluation.md (Quality Gates,
    pass-threshold Scores table, Reflection Checklist, Reflection Process),
    not a fact base. Scoped to a single generator/evaluator pair rather than
    reusable across domains: unlike kb-L2-domain-market or
    kb-L2-domain-regulatory, it carries no domain facts and has no
    independent update cadence of its own — it changes only when
    evaluation.md changes, and exists purely so
    L1-vision-statement-generator-evaluator can retrieve it via a runtime
    KB query instead of the rubric being duplicated into the evaluator's
    own prompt.

content:
  format: markdown
  documents:
    - path: content/evaluation-rubric.md
      sections: [quality-gates, scores, reflection-checklist, reflection-process]
  total_tokens_estimate: 655
  chunking: by-section   # one chunk per H2 section — matches the by-section pattern used by every other multi-section KB in this repo (whole-document is reserved for single-section KBs like kb-L1-regulatory-frameworks-index)
  chunk_size_tokens:
    quality-gates: 179
    scores: 265
    reflection-checklist: 83
    reflection-process: 63
  chunk_overlap_tokens: 0   # each section is a self-contained checklist/table/list — no cross-section continuity to preserve
  semantic_boundary: "markdown H2 headers (##) — one chunk per heading in content/evaluation-rubric.md"
  embedding_model: text-embedding-3-small

grounding_rules:
  accessed_by: [L1-vision-statement-generator-evaluator]
  visibility: "L1 — visible to all layers (L1/L2/L3/L4) per standard visibility rule"

freshness:
  trigger_for_update: "L1-vision-statement-generator/evaluation.md changes — this KB is a runtime copy of that file, not a fork; keep both in sync"
  note: >
    L1-vision-statement-generator/evaluation.md remains the source of truth
    for this rubric. This KB exists so the evaluator can query it at
    runtime; it must never be edited independently of that source file.
