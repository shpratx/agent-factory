# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-market-analyzer
  version: "1.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"

purpose:
  description: "Produces a five-dimension market analysis for a proposed idea: competitive intelligence (competitor matrix), market sizing (TAM/SAM/SOM), industry trends, customer insights, and pricing benchmarks, plus a SWOT synthesis."
  input: "idea-brief.md items (problem statement, target users) from L1-vision-idea-intake."
  output: "Structured competitor/market-sizing/industry-trends/customer-insights/pricing-benchmarks/SWOT items only — no separate document; items carry the full analysis directly."
  business_value: "No idea should reach a funding decision without knowing who else already solves this problem — this agent makes that check mandatory and consistent rather than ad hoc."

prompt:
  ref: "prompts/L1-vision-market-analyzer/instructions.md"
  version: "1.0.0"
  description: "Grounds competitor analysis in a domain market KB plus live web search; every claim carries a citation."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-idea-intake]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      problem_statement: { type: string, description: "From L1-vision-idea-intake's idea_brief items" }
      target_users: { type: array, description: "From L1-vision-idea-intake's idea_brief items" }
    optional_parameters:
      known_competitor_list: { type: array, default: [], description: "Known competitors, if the requester already has candidates in mind" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L2-domain-market
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-hallucination-check
    - gr-L1-citation-verifier   # BLOCKER — every competitor claim must cite a source
  tools:
    - tool-L1-web-search-competitor-scan   # read-only; invoked directly, per the Core/Utility split. Used for market research broadly — sizing, trends, pricing benchmarks, and customer insights — not competitor-scanning alone; name is legacy and unchanged to avoid rippling across the BOM/catalog/workflow

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 30   # bounded by external search tool round-trip
  max_token_budget: 6000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
