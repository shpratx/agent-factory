# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-regulatory-feasibility-checker-evaluator
  version: "2.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"
  updated: "2026-08-21"

purpose:
  description: "Independently scores L1-vision-regulatory-feasibility-checker's output, with zero tolerance for a Red constraint that lacks a mitigation or legal-review flag, or that appears to have been downgraded to avoid writing one — and re-derives the viability score from the final constraints rather than accepting the one reported."
  input: "L1-vision-regulatory-feasibility-checker's original input plus its draft output, including its viability object."
  output: "The corrected regulatory feasibility result including the re-derived viability score, plus scores, findings, fixes applied, and a final decision."
  business_value: "This is the highest-stakes evaluator in Phase 0 — a false negative here (a Red constraint that slips through unmitigated, or gets quietly relabeled Amber) is a compliance risk that reaches a human decision-maker as if it were already handled. Since v2.0 it also holds the gate number itself: the viability score it approves is what qg-L1-viability-score thresholds and what L1-vision-statement-generator receives, so a severity fix that fails to move the score would let a blocked idea auto-publish."

prompt:
  ref: "prompts/L1-vision-regulatory-feasibility-checker-evaluator/instructions.md"
  version: "2.0.0"
  description: "Scores against L1-vision-regulatory-feasibility-checker/evaluation.md; re-derives severity, category coverage, and the viability score independently rather than trusting the generator's own classification or arithmetic at face value."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-regulatory-feasibility-checker]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The input L1-vision-regulatory-feasibility-checker received" }
      generator_output: { type: object, description: "L1-vision-regulatory-feasibility-checker's draft items output, including constraints, overall_status, categories_not_applicable, viability and open_items" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-regulatory-feasibility-evaluation-rubric   # runtime copy of L1-vision-regulatory-feasibility-checker/evaluation.md — see that KB's spec.yaml for source-of-truth note
    # Jurisdiction is read from each KB's own #jurisdiction section at runtime, never assumed here.
    # Attach the SAME pair the generator ran against, selected by target_geography:
    #   India — *-ind   |   United Kingdom — *-uk
    - kb-L1-regulatory-frameworks-index-ind   # >=3.1.0 — #jurisdiction declares coverage; #cross-domain-index sanity-checks a citation's plausibility; #coverage-categories is the sweep list the generator walked, re-read here so the audit and the sweep cannot diverge
    - kb-L2-domain-regulatory-ind   # >=2.1.0 — #jurisdiction declares coverage; domain facts for groundedness, not merely category plausibility
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-citation-verifier
    - gr-L1-regulatory-feasibility-quality-gate   # fires when THIS evaluator concludes; validates L1-vision-regulatory-feasibility-checker's RESULTANT output against its own schema+evaluation.md, zero-tolerance mitigation rule re-checked directly (guardrails/gr-L1-regulatory-feasibility-quality-gate)
  tools:
    - tool-L1-azure-blob-reader      # reads regulatory-feasibility.md and idea-brief.json for full-text and groundedness checks
    - tool-L1-azure-blob-writer      # re-saves regulatory-feasibility.md when a fix changes its content

quality:
  evaluation_ref: "evaluation.md"
  min_score: 8.5   # highest bar of any Phase 0 evaluator, matching the generator's own zero-tolerance requirement
  hallucination_check: true
  consistency_check: true

quality_gates_owned:
  qg-L1-viability-score:
    threshold: 7
    description: "The viability score is re-derived here from the FINAL post-fix constraints and emitted as items.viability. This evaluator's number, not the generator's, is what the gate thresholds and what L1-vision-statement-generator receives."

performance:
  target_latency_seconds: 30   # raised from 20: the category coverage sweep plus the score re-derivation
  max_token_budget: 8000

versioning:
  input_version: "2.0"
  output_version: "2.0"
  instruction_hash: "sha256:pending"
