# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-regulatory-feasibility-checker
  version: "2.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"
  updated: "2026-08-21"

purpose:
  description: "Classifies regulatory feasibility (licensing, data protection, consumer, sector and cross-cutting regimes) for a proposed idea as Green/Amber/Red per constraint, with citation and mitigation — and derives the viability_score that gates the pipeline at qg-L1-viability-score."
  input: "idea-brief.json (problem statement, target geography/product category, target users, value proposition) from L1-vision-idea-intake."
  output: "regulatory-feasibility.md artifact plus structured constraint items and the viability score with its component breakdown and caps."
  business_value: "A viable-looking idea can be dead on arrival for regulatory reasons — this must surface before roadmap commitment, not after. Zero tolerance for omitting a Red-classified constraint: a false negative here is a compliance risk, not a quality nuance. Owning the viability score here keeps the gate with the agent that holds the blocking evidence, and out of the agent whose auto-publish depends on it."

prompt:
  ref: "prompts/L1-vision-regulatory-feasibility-checker/instructions.md"
  version: "2.0.0"
  description: "Walks the coverage-category sweep list held in kb-L1-regulatory-frameworks-index against a domain-specific regulatory KB; every constraint is cited, every Amber/Red carries a mitigation or legal-review flag, and the viability score is derived from the regulatory posture plus idea clarity with unresolved blockers applied as hard caps. The sweep list lives in the KB so the evaluator's coverage audit reads the identical list; the scenario-pattern behaviours stay in the prompt."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-idea-intake]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: true
      formats: [".json"]   # idea-brief.json — parsed as JSON by key path, never scanned as markdown
    required_parameters:
      problem_statement: { type: string, description: "From L1-vision-idea-intake's idea-brief.json" }
      target_geography: { type: string, description: "Target geography for the idea — a country, or a country plus sub-national regions. Resolved at runtime against the jurisdiction the attached KBs declare; a country they do not cover fails with JURISDICTION_MISMATCH rather than being translated" }
      generated_date: { type: string, description: "The date this run executes, supplied inside idea-brief.json (any common format, e.g. dd-mm-yyyy — normalized to yyyy-mm-dd for the artifact). The agent has no independent clock and cannot rely on orchestrator injection, so this must be present in the brief; never inferred from an example or a golden fixture." }
    optional_parameters:
      product_category: { type: string, default: null, description: "Product/activity category, if known, to narrow the regulator lookup" }
      target_users: { type: string, default: null, description: "Target user segment from idea-brief.json — feeds both the segment-specific constraint sweep and the idea_clarity viability component" }
      value_proposition: { type: string, default: null, description: "Value proposition from idea-brief.json — feeds claim-substantiation constraints and the idea_clarity viability component" }

  output:
    $ref: "output_schema.json"

context:
  # Jurisdiction is NOT set here. The agent is jurisdiction-neutral: each KB
  # declares its own coverage in a #jurisdiction section, and the agent resolves
  # that against the brief's target_geography at runtime, failing with
  # JURISDICTION_MISMATCH when they disagree. Re-targeting the deployment to
  # another country means swapping the KBs below — the prompt is unchanged.
  # Attach ONE matched pair, selected by the idea brief's target_geography.
  # Both KBs in the pair must declare the same jurisdiction — the agent fails
  # with JURISDICTION_MISMATCH if they disagree with each other or with the brief.
  # India:          kb-L1-regulatory-frameworks-index-ind + kb-L2-domain-regulatory-ind
  # United Kingdom: kb-L1-regulatory-frameworks-index-uk  + kb-L2-domain-regulatory-uk
  knowledge_bases:
    - kb-L1-regulatory-frameworks-index-ind   # >=3.1.0 — declares its jurisdiction; carries #coverage-categories (the sweep list) and #cross-domain-index
    - kb-L2-domain-regulatory-ind             # >=2.1.0 — declares its jurisdiction; domain regulatory facts for that country
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-hallucination-check
    - gr-L1-citation-verifier   # BLOCKER — every constraint must cite a specific regulation/section
  tools:
    - tool-L1-regulatory-db-lookup   # read-only; invoked directly, per the Core/Utility split
    - tool-L1-azure-blob-reader      # reads idea-brief.json from blob storage
    - tool-L1-azure-blob-writer      # writes regulatory-feasibility.md to blob storage

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

quality_gates_owned:
  qg-L1-viability-score:
    threshold: 7
    description: "viability.viability_score is derived here from regulatory posture (0.60) and idea clarity (0.40), with unresolved regulatory blockers applied as hard caps. L1-vision-statement-generator receives the number as an input parameter and may not compute or adjust it."

performance:
  target_latency_seconds: 45   # raised from 30: the scenario coverage sweep plus score derivation
  max_token_budget: 9000

versioning:
  input_version: "1.0"
  output_version: "2.0"
  instruction_hash: "sha256:pending"
