# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-planning-impact-dependency-aggregator
  version: "1.0.0"
  layer: L1
  phase: planning
  owner: agentic-ai-coe
  created: "2026-08-14"

purpose:
  description: "Combines L1-impact-assessment.md and L1-dependency-graph.mmd into a single consolidated markdown artifact (L1-impact-assessment-dependency-graph.md) for downstream consumers who need both views in one place. Verbatim pass-through — no analysis, no re-derivation."
  input: "L1-impact-assessment.md and L1-dependency-graph.mmd (from L1-planning-impact-dependency-mapper)"
  output: "L1-impact-assessment-dependency-graph.md — one combined artifact"
  business_value: "Eliminates the need for downstream consumers (human reviewers, confluence publishers, backlog prioritizer) to switch between separate impact assessment and dependency graph files."

prompt:
  ref: "prompts/L1-planning-impact-dependency-aggregator/instructions.md"
  version: "1.0.0"
  description: "Retrieves both source artifacts from blob storage, validates they are present and consistent, concatenates the impact assessment text followed by the Mermaid diagram in a fenced code block, and saves the combined document."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-planning-dependency-graph-evaluator]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".md", ".mmd"]
    required_parameters:
      folder_name: {type: string, description: "Blob storage folder to read source artifacts from and write the combined artifact to"}
    optional_parameters:
      impact_assessment_md: {type: string, default: "", description: "Full text of L1-impact-assessment.md if provided directly"}
      dependency_graph_mmd: {type: string, default: "", description: "Full text of L1-dependency-graph.mmd if provided directly"}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases: []
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
  tools:
    - tool-L1-blob-storage-read-artifact   # reads L1-impact-assessment.md and L1-dependency-graph.mmd

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
