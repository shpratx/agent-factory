# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-requirements-nfr-classifier
  version: "1.0.0"
  layer: L1
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-08-08"

purpose:
  description: "Classifies every functional requirement's non-functional boundary conditions across the six standard NFR categories (performance, security, scalability, availability, compliance, usability), citing a grounded source or honestly marking TBD."
  input: "requirements.md (agent_output from L1-requirements-elicitor) plus regulatory-feasibility.md (Phase 0 artifact from L1-vision-regulatory-feasibility-checker, cited directly)."
  output: "nfr-spec.md artifact plus structured NFR-classification items."
  business_value: "L1-requirements-prd-composer and Phase 4's L1-design-hld both need every requirement's cross-functional constraints resolved to a real, checkable source — a fabricated performance/availability number discovered at design time is far more expensive to fix than one caught here. This agent is the single point where an FR's boundary conditions are classified once, consistently, against a real source or an honest TBD, instead of each downstream agent guessing independently."

prompt:
  ref: "prompts/L1-requirements-nfr-classifier/instructions.md"
  version: "1.0.0"
  description: "Classifies each requirements.md FR against kb-L1-nfr-classification-taxonomy's six categories; grounds every non-TBD boundary condition in requirements.md, vision.md, regulatory-feasibility.md, or kb-L1-enterprise-security — never a bare guess."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-requirements-elicitor, L1-vision-regulatory-feasibility-checker]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      requirements_output: { type: object, description: "L1-requirements-elicitor's agent_output — must have status: success with >=1 functional_requirements item; supplies the FR set to classify, same ids and order as requirements.md" }
      regulatory_feasibility_output: { type: object, description: "L1-vision-regulatory-feasibility-checker's agent_output (Phase 0 artifact) — read directly for Compliance-category citations, not a knowledge base" }
    optional_parameters: {}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-nfr-classification-taxonomy   # classification METHOD only (what question to ask per category, what form the answer takes) — never supplies a number itself
    - kb-L1-enterprise-architecture       # enterprise-wide, cross-phase — system landscape context; rarely the direct citation source, but checked for boundary-relevant integration facts
    - kb-L1-enterprise-security           # enterprise-wide, cross-phase — real source for Security/Compliance/Availability boundary conditions a group policy already answers (e.g. retention period, uptime tier)
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-consistency-check
  tools: []   # this agent classifies against already-supplied input + attached KBs; no read/write platform tool call needed

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 14
  max_token_budget: 6000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
