# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-requirements-prd-composer-evaluator
  version: "1.0.0"
  layer: L1
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-08-06"

purpose:
  description: "Independently re-verifies L1-requirements-prd-composer's zero-drop composition — every FR and NFR boundary condition preserved, every carried-forward Assumption/Constraint/Risk genuinely traceable, and success metrics genuinely absent."
  input: "L1-requirements-prd-composer's original input plus its draft output."
  output: "Scores, findings, any fixes applied (pushed back to prd.md when they touch document content), and a final decision."
  business_value: "Letting a generator grade its own homework defeats the point of a quality gate. This agent independently re-derives zero-drop composition (every requirements.md FR present, every nfr-spec.md boundary condition attached to the right FR), re-checks that Assumptions/Constraints/Risks genuinely trace to vision.md or a specific FR, and confirms no success metric was smuggled in despite the template's explicit exclusion."

prompt:
  ref: "prompts/L1-requirements-prd-composer-evaluator/instructions.md"
  version: "1.0.0"
  description: "Scores against L1-requirements-prd-composer/evaluation.md; independently re-derives FR/NFR coverage from requirements.md and nfr-spec.md rather than trusting the composer's own confidence fields."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-requirements-prd-composer]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The requirements_output, nfr_spec_output, and vision_output L1-requirements-prd-composer received" }
      generator_output: { type: object, description: "L1-requirements-prd-composer's draft items+artifact output" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-requirements-prd-composer/evaluation.md"   # source of truth for scoring — not duplicated in this agent's prompt
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-consistency-check   # independently re-checks the generator's own BLOCKER guardrail (zero-drop composition) rather than trusting its pass/fail claim
    - gr-L1-prd-quality-gate   # fires when THIS evaluator concludes; validates L1-requirements-prd-composer's RESULTANT output against its own schema + evaluation.md (zero-drop FR/NFR, verbatim compound_splits, tagged Assumptions/Constraints/Risks, absent success metrics) (guardrails/gr-L1-prd-quality-gate)
  tools: []   # evaluators score and fix; they don't call platform tools themselves

quality:
  evaluation_ref: "evaluation.md"   # this file covers THIS evaluator's own meta-quality, not the generator's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong requirement
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 18
  max_token_budget: 8000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
