# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-requirements-elicitor
  version: "1.0.0"
  layer: L1
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-08-08"

purpose:
  description: "Converts an approved vision statement into structured, atomic, traceable functional requirements."
  input: "Approved vision.md (agent_output) plus a recorded Product Lead approval comment."
  output: "Structured items only, no document artifact — atomic functional-requirement items (functional_requirements[], compound_splits[]), each FR statement carried in full and traced to exactly one vision.md section."
  business_value: "First agent in Phase 1 — every downstream step (NFR classification, PRD composition, impact assessment, dependency mapping, and Phase 3's story generation) needs the same atomic, traceable requirement set. Without this agent, each would re-interpret vision.md independently and drift."

prompt:
  ref: "prompts/L1-requirements-elicitor/instructions.md"
  version: "1.0.0"
  description: "Extracts atomic functional requirements from an approved vision, splitting any compound clause and tracing every requirement to exactly one vision.md section; refuses to run without a recorded approval."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-statement-generator]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      vision_output: { type: object, description: "L1-vision-statement-generator's agent_output — must have status: success and a recorded Approval" }
      approval_comment: { type: string, description: "The Product Lead's approval comment text, quoted verbatim — this agent refuses to run without one" }
    optional_parameters: {}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-requirements-quality-standard   # mechanical self-check only (vague-term scan, compound-clause scan) — full rubric lives with the evaluator
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-hallucination-check
    - gr-L1-consistency-check
  tools:
    - tool-L1-confluence-fetch-page   # read-only; fetches the approval comment if it lives on the vision.md Confluence page rather than passed inline

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 12
  max_token_budget: 5000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
