# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-idea-intake
  version: "1.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"

purpose:
  description: "Structures a raw idea into a problem statement, target users, and candidate success metrics."
  input: "Raw idea brief text (direct input) or a Confluence page reference, plus an optional stakeholder list."
  output: "Structured items only, no document artifact (problem statement, target users, value proposition, candidate success metrics, open questions), each carried in full and grounded via traced_to."
  business_value: "Every downstream Phase 0 agent (market analysis, regulatory feasibility, vision synthesis) needs the same structured starting facts. Without this agent, each would re-interpret the raw idea text independently and drift."

prompt:
  ref: "prompts/L1-vision-idea-intake/instructions.md"
  version: "1.0.0"
  description: "Extracts problem statement, target users, value proposition, and candidate metrics from a raw idea; flags anything missing rather than inventing it."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: []
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".md", ".txt"]
    required_parameters: {}   # exactly one of idea_brief_text / confluence_page_ref is required — see optional_parameters and instructions.md's Input Ingestion validation
    optional_parameters:
      idea_brief_text: { type: string, default: null, description: "Raw free-text idea brief, up to ~2,000 words. Required unless confluence_page_ref is given." }
      confluence_page_ref: { type: string, default: null, description: "Confluence page URL/ID to fetch the raw brief from, if idea_brief_text is not passed inline. Required unless idea_brief_text is given." }
      stakeholder_list: { type: array, default: [], description: "Sponsoring stakeholder names/roles, if known" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases: []   # idea-brief structure is embedded in instructions.md per S4 — no KB needed
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-hallucination-check
    - gr-L1-consistency-check
  tools:
    - tool-L1-confluence-fetch-page   # read-only; invoked directly, per the Core/Utility split (writes are Utility-only)

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 10
  max_token_budget: 4000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
