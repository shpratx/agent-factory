# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-market-analyzer-evaluator
  version: "1.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"

purpose:
  description: "Independently scores L1-vision-market-analyzer's output against its evaluation.md rubric, with particular focus on the citation-completeness BLOCKER; fixes fixable issues, escalates what isn't."
  input: "L1-vision-market-analyzer's original input plus its draft output."
  output: "Scores, findings, any fixes applied, and a final decision."
  business_value: "gr-L1-citation-verifier is a BLOCKER for this generator — a competitor claim without a citation is exactly the kind of thing a generator's own self-check might miss under time pressure. This evaluator's whole job is to not miss it."

prompt:
  ref: "prompts/L1-vision-market-analyzer-evaluator/instructions.md"
  version: "1.0.0"
  description: "Scores against L1-vision-market-analyzer/evaluation.md; citation completeness is checked exhaustively, not sampled."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-market-analyzer]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The input L1-vision-market-analyzer received" }
      generator_output: { type: object, description: "L1-vision-market-analyzer's draft items output" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-vision-market-analyzer/evaluation.md"
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-citation-verifier   # re-checked independently, not just trusted from the generator's own pass/fail
    - gr-L1-market-analysis-quality-gate   # fires when THIS evaluator concludes; validates L1-vision-market-analyzer's RESULTANT output against its own schema+evaluation.md (guardrails/gr-L1-market-analysis-quality-gate)
  tools: []

quality:
  evaluation_ref: "evaluation.md"
  min_score: 8.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 5000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
