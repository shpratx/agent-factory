# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-planning-dependency-mapper-evaluator
  version: "1.0.0"
  layer: L1
  phase: planning
  owner: agentic-ai-coe
  created: "2026-08-08"

purpose:
  description: "Independently RE-COMPUTES the cycle check and longest blocking path from L1-planning-dependency-mapper's raw nodes/edges — never trusts the generator's own cycle_check.status or critical_path.nodes fields at face value."
  input: "L1-planning-dependency-mapper's original input (impact_assessment_output, prd_output) plus its draft output."
  output: "Scores, findings, any fixes applied (including a corrected dependency-graph.json re-saved to the same s3 location), and a final decision."
  business_value: "A schema-valid graph can still be wrong — a reversed edge or an unverified cycle claim passes every structural check and still produces a nonsensical build order (see phase-1/README.md's own worked-example bug). Letting the generator's own asserted cycle_check/critical_path stand unchecked defeats the point of a quality gate; this agent proves the numbers by running the traversal itself."

prompt:
  ref: "prompts/L1-planning-dependency-mapper-evaluator/instructions.md"
  version: "1.0.0"
  description: "Scores against L1-planning-dependency-mapper/evaluation.md; independently re-derives cycle_check via DFS and critical_path via longest-path computation from raw nodes/edges, comparing against the generator's declared values rather than trusting them."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-planning-dependency-mapper]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The impact_assessment_output and prd_output L1-planning-dependency-mapper received" }
      generator_output: { type: object, description: "L1-planning-dependency-mapper's draft items output (nodes, edges, cycle_check, critical_path)" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-planning-dependency-mapper/evaluation.md"   # source of truth for scoring — never duplicated into this agent's own prompt
    - kb-L1-enterprise-architecture   # spot-checks node/edge grounding against the same EA facts the generator used — never re-derives component boundaries independently
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-dependency-graph-quality-gate   # fires when THIS evaluator concludes; independently RE-COMPUTES the DFS cycle check and longest-path critical_path over the RESULTANT (post-fix) nodes/edges and compares against what that resultant content claims — never trusts this evaluator's own re-derivation, or the generator's, at face value (guardrails/gr-L1-dependency-graph-quality-gate)
  tools: []   # evaluators score and fix; they don't call platform tools themselves

quality:
  evaluation_ref: "evaluation.md"   # this file covers THIS evaluator's own meta-quality, not the generator's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong cycle/critical-path finding is worse than a wrong node
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 6000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
