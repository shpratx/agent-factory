# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-confluence-publisher
  version: "1.0.0"
  layer: L1
  phase: cross-cutting   # reusable across Phase 0 (vision.md) and Phase 4 (design docs) — not tied to one phase
  owner: agentic-ai-coe
  created: "2026-08-02"

purpose:
  description: "Publishes a markdown artifact to Confluence. The ONLY agent in this pipeline that calls a Confluence write tool — no Core generator does this itself."
  input: "A document artifact (id, name, content) from an upstream Core agent, plus target space/page metadata."
  output: "The published page's URL, space, title, and whether it was created or updated."
  business_value: "This is the exact split the anti-pattern in agent-standards-best-practices.html calls out: 'the Vision Generator writes its output directly to a Confluence page... this couples the agent to a platform.' Splitting publishing into its own Utility agent means swapping Confluence for Notion only touches this one agent, not every Core generator that happens to produce a document."

prompt:
  ref: "prompts/L1-confluence-publisher/instructions.md"
  version: "1.0.0"
  description: "Publishes one artifact per invocation; never overwrites an existing page without an explicit update flag."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-statement-generator, any]   # reused wherever a document needs publishing — not locked to one Core agent
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      artifact: { type: object, description: "The artifact object (id, name, content, format) to publish" }
      target_space: { type: string, description: "Confluence space key to publish into" }
    optional_parameters:
      target_page_id: { type: string, default: null, description: "If updating an existing page rather than creating a new one" }
      update: { type: boolean, default: false, description: "Must be explicitly true to overwrite an existing page — never implied" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases: []   # Utility agents hold no domain logic
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
  tools:
    - tool-L1-confluence-create-page

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: false   # not applicable — this agent doesn't generate content, only publishes what it's given
  consistency_check: true

performance:
  target_latency_seconds: 10
  max_token_budget: 1500   # Utility agents are cheap — no generation, just a tool call

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
