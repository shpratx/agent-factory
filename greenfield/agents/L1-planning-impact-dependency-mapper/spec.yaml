# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-planning-impact-dependency-mapper
  version: "1.0.0"
  layer: L1
  phase: planning
  owner: agentic-ai-coe
  created: "2026-08-14"

purpose:
  description: "Assesses proposed components against the existing enterprise estate (Impact Assessment), then builds a DFS/longest-path-verified dependency graph directly from that same assessment (Dependency Graph + Mermaid render) — Impact Assessment always runs first."
  input: "prd.md (from L1-requirements-prd-composer) plus raw service_catalog and cmdb_export system exports"
  output: "L1-impact-assessment.md, L1-dependency-graph.json, and L1-dependency-graph.mmd — three artifacts from one execution, in that order"
  business_value: "Removes the blob round-trip and drift risk between impact assessment and dependency graphing by having one agent produce the graph directly from its own assessment, while keeping evaluation of each half independent and unmerged."

prompt:
  ref: "prompts/L1-planning-impact-dependency-mapper/instructions.md"
  version: "1.0.0"
  description: "Two-phase prompt: Phase A fills and saves the Impact Assessment template; Phase B builds nodes/edges directly from Phase A's own Components Identified / External Dependencies tables, runs DFS cycle check + longest-path critical path, then renders and saves a 1:1 Mermaid diagram."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-requirements-prd-composer]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".md", ".json"]
    required_parameters:
      prd: {type: object, description: "prd_output (AgentOutput) from L1-requirements-prd-composer; status must be success"}
      folder_name: {type: string, description: "Blob storage folder to read exports from and write all three artifacts to"}
    optional_parameters:
      service_catalog: {type: object, default: "{}", description: "Raw service catalog export (ServiceNow/Backstage/equivalent); empty means no parent enterprise"}
      cmdb_export: {type: object, default: "{}", description: "Raw CMDB export (configuration_items[], relationships[]); empty means no parent enterprise"}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-enterprise-architecture
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L3-consistency-checker
  tools:
    - tool-L1-blob-storage-read-artifact   # reads prd.md, service_catalog, cmdb_export

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
