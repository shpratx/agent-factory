# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-planning-dependency-mapper
  version: "1.0.0"
  layer: L1
  phase: planning
  owner: agentic-ai-coe
  created: "2026-08-08"

purpose:
  description: "Builds a dependency graph across proposed components and external dependencies from impact-assessment.md + prd.md, independently computing (never just asserting) a cycle check and a critical path."
  input: "impact-assessment.md (agent_output, full) plus prd.md (agent_output, full) — both from L1-planning-impact-assessor and L1-requirements-prd-composer respectively."
  output: "dependency-graph.json — nodes (components + external dependencies), edges (uniform prerequisite -> dependent direction), an independently-computed cycle_check, and an independently-computed critical_path."
  business_value: "L1-planning-backlog-prioritizer needs a topological-sort-ready graph, and Phase 4's L1-design-hld needs to know the real build-order constraints — not a hand-wave. A schema-valid graph with a reversed edge or an unverified cycle claim would pass every structural check and still be wrong; this agent exists to run the actual traversal, not just assemble the shape."

prompt:
  ref: "prompts/L1-planning-dependency-mapper/instructions.md"
  version: "1.0.0"
  description: "Builds nodes from impact-assessment.md's components + external dependencies, builds edges preserving uniform prerequisite->dependent direction, runs an actual DFS cycle check and an actual longest-blocking-path computation, and reports a genuine tie honestly rather than arbitrarily breaking it."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-planning-impact-assessor, L1-requirements-prd-composer]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      impact_assessment_output: { type: object, description: "L1-planning-impact-assessor's full agent_output — must have status: success; supplies the Components Identified table (FR -> component -> blast radius) and the External Dependencies list this agent builds nodes/edges from" }
      prd_output: { type: object, description: "L1-requirements-prd-composer's full agent_output — must have status: success; supplies the full FR-NNN set this agent must fully cover across nodes' source_requirement arrays" }
    optional_parameters: {}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-enterprise-architecture   # confirms component boundaries / integration patterns (e.g. mandatory API-gateway routing) already established during impact assessment are respected as edges, not re-derived independently from scratch
  guardrails:
    - gr-L1-output-schema-validator   # per BOM: hard-rejects a graph whose cycle_check.status is FAIL from validating as a normal success — a detected cycle must escalate, never pass silently
    - gr-L1-pii-detection
    - gr-L1-hallucination-check       # no node/edge invented beyond a component or external dependency actually named in impact-assessment.md
    - gr-L1-consistency-check         # every FR in prd.md traces into some node's source_requirement — zero requirements dropped between impact-assessment.md and the graph
  tools: []   # no direct tool access — this agent produces an artifact only, same Core/Utility split as L1-vision-statement-generator and L1-requirements-prd-composer

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 6000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
