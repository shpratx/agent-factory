# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-idea-intake-evaluator
  version: "1.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"

purpose:
  description: "Independently scores L1-vision-idea-intake's output against its evaluation.md rubric, fixes fixable issues directly in items, and reports the result — or escalates to HITL if it can't reach a passing score."
  input: "L1-vision-idea-intake's original input plus its draft output."
  output: "Scores, findings, any fixes applied, and a final decision."
  business_value: "Letting a generator grade its own homework defeats the point of a quality gate. This agent is the independent, different-prompt check the Generator->Evaluator pattern requires (S6) — it does not duplicate the generator's rubric in its own prompt, it loads evaluation.md as source of truth."

prompt:
  ref: "prompts/L1-vision-idea-intake-evaluator/instructions.md"
  version: "1.0.0"
  description: "Scores against L1-vision-idea-intake/evaluation.md; fixes what can be fixed without re-running the generator from scratch; escalates what can't."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-idea-intake]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The input L1-vision-idea-intake received" }
      generator_output: { type: object, description: "L1-vision-idea-intake's draft items output" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-vision-idea-intake/evaluation.md"   # source of truth for scoring — not duplicated in this agent's prompt
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-idea-intake-quality-gate   # fires when THIS evaluator concludes; validates L1-vision-idea-intake's RESULTANT output against its own schema+evaluation.md (guardrails/gr-L1-idea-intake-quality-gate)
  tools: []

quality:
  evaluation_ref: "evaluation.md"   # this file covers THIS evaluator's own meta-quality, not the generator's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong story
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 5000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
