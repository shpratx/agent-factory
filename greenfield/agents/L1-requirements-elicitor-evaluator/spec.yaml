# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-requirements-elicitor-evaluator
  version: "1.0.0"
  layer: L1
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-08-08"

purpose:
  description: "Independently scores L1-requirements-elicitor's output against ISO/IEC/IEEE 29148's requirement quality characteristics, fixes fixable issues, escalates what isn't."
  input: "L1-requirements-elicitor's original input plus its draft output."
  output: "Scores, findings, any fixes applied, and a final decision."
  business_value: "Letting a generator grade its own homework defeats the point of a quality gate. This agent independently re-checks the characteristics the elicitor's own self-check can't judge itself — Complete's coverage, Verifiable's testability, Consistent's contradiction check, and the Feasible/Correct judgment calls — not just the mechanical vague-term/compound-clause scans."

prompt:
  ref: "prompts/L1-requirements-elicitor-evaluator/instructions.md"
  version: "1.0.0"
  description: "Scores against L1-requirements-elicitor/evaluation.md; re-derives coverage and testability independently rather than trusting the elicitor's own confidence fields."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-requirements-elicitor]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The vision_output and approval_comment L1-requirements-elicitor received" }
      generator_output: { type: object, description: "L1-requirements-elicitor's draft items output" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-requirements-elicitor/evaluation.md"   # source of truth for scoring — not duplicated in this agent's prompt
    - kb-L1-requirements-quality-standard   # full rubric — Complete/Verifiable/Consistent/Feasible/Correct, not just the elicitor's mechanical subset
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-requirements-quality-gate   # fires when THIS evaluator concludes; validates L1-requirements-elicitor's RESULTANT output against its own schema + kb-L1-requirements-quality-standard (guardrails/gr-L1-requirements-quality-gate)
  tools: []

quality:
  evaluation_ref: "evaluation.md"   # this file covers THIS evaluator's own meta-quality, not the generator's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong requirement
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 5000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
