# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-requirements-prd-composer
  version: "1.0.0"
  layer: L1
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-08-06"

purpose:
  description: "Composes L1-requirements-elicitor's and L1-requirements-nfr-classifier's items into one authoritative PRD — every functional requirement together with its cross-functional (performance/security/compliance/etc.) constraints in one place, not split across two separate outputs a reader must cross-reference."
  input: "functional_requirements + compound_splits items (from L1-requirements-elicitor, full — no document, 2026-08-07) plus nfr_classifications items (from L1-requirements-nfr-classifier, full — no document, 2026-08-07); vision.md artifact (read-only) for Assumptions/Constraints/Risks carry-forward only."
  output: "prd.md artifact plus structured items composing every requirement with its NFRs, condensed Assumptions/Constraints/Risks, and an Open Questions rollup."
  business_value: "L1-planning-impact-assessor and L1-planning-dependency-mapper need one composed source of truth instead of cross-referencing the elicitor's and classifier's items separately. This agent is also the last automated checkpoint that could silently drop a requirement or an NFR boundary condition between elicitation/classification and downstream planning — zero-drop composition is the concrete test, not just formatting."

prompt:
  ref: "prompts/L1-requirements-prd-composer/instructions.md"
  version: "1.0.0"
  description: "Composes the elicitor's and classifier's items verbatim into prd.md; condenses vision.md's Regulatory Posture / Open Risks Carried Forward into Assumptions/Constraints/Risks traceable to a specific FR or 'program-level'; excludes success metrics by design."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-requirements-elicitor, L1-requirements-nfr-classifier, L1-vision-statement-generator]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      requirements_output: { type: object, description: "L1-requirements-elicitor's agent_output — must have status: success; supplies functional_requirements[] and compound_splits[] in full" }
      nfr_spec_output: { type: object, description: "L1-requirements-nfr-classifier's agent_output — must have status: success; supplies every FR's NFR boundary-condition table, same ids and order as requirements_output" }
      vision_output: { type: object, description: "L1-vision-statement-generator's agent_output — must have status: success; read-only, used ONLY for the Regulatory Posture and Open Risks Carried Forward sections this agent condenses into Assumptions/Constraints/Risks. Not re-analyzed for anything the elicitor's/classifier's items already cover." }
      approval_comment: { type: string, description: "The Product Lead's approval comment text, quoted verbatim, from the same vision-approval gate L1-requirements-elicitor consumed — passed through directly since there is no requirements document header to retrieve it from (2026-08-07)" }
    optional_parameters: {}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases: []   # the elicitor's and classifier's items are consumed in full, not summarized against a KB; prd.template.md is ≤3K tokens and purely structural — embedded in the prompt per S4, matching L1-vision-statement-generator's precedent
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-hallucination-check   # no new product-level assumption/constraint/risk invented beyond vision.md or a specific FR
    - gr-L1-consistency-check     # zero requirements dropped in composition, zero NFR boundary conditions dropped
  tools: []   # no direct tool access — this agent produces an artifact only, same Core/Utility split as L1-vision-statement-generator

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 8000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
