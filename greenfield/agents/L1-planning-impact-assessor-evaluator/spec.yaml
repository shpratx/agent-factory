# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-planning-impact-assessor-evaluator
  version: "1.0.0"
  layer: L1
  phase: planning
  owner: agentic-ai-coe
  created: "2026-08-08"

purpose:
  description: "Independently re-runs L1-planning-impact-assessor's capability check and technical-touch check against the same enterprise-data exports and kb-L1-enterprise-architecture, catching any mismatch the generator's own pass missed."
  input: "L1-planning-impact-assessor's original input (prd_output, service_catalog, cmdb_export) plus its draft output."
  output: "Scores, findings, any fixes applied, and a final decision."
  business_value: "Letting a generator grade its own capability/technical-touch checks against the estate it just checked defeats the point of a quality gate. This agent independently re-derives both checks from the SAME source data and KB narrative — a wrongly-dismissed service-catalog match, or a CI the CMDB and KB disagree about, is exactly the kind of error a generator re-checking its own work would not catch."

prompt:
  ref: "prompts/L1-planning-impact-assessor-evaluator/instructions.md"
  version: "1.0.0"
  description: "Scores against L1-planning-impact-assessor/evaluation.md; independently re-derives the capability and technical-touch checks from service_catalog/cmdb_export/kb-L1-enterprise-architecture rather than trusting the generator's own findings."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-planning-impact-assessor]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The prd_output, service_catalog, and cmdb_export L1-planning-impact-assessor received" }
      generator_output: { type: object, description: "L1-planning-impact-assessor's draft items output" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-planning-impact-assessor/evaluation.md"   # source of truth for scoring — not duplicated in this agent's prompt
    - kb-L1-enterprise-architecture   # re-checked independently against the SAME service_catalog/cmdb_export, not trusted from the generator's own pass
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L2-food-domain-compliance   # BLOCKER the generator owns — re-checked independently, not by trusting the generator's own pass/fail claim
    - gr-L1-impact-assessment-quality-gate   # fires when THIS evaluator concludes; validates L1-planning-impact-assessor's RESULTANT output against its own schema + evaluation.md rubric (guardrails/gr-L1-impact-assessment-quality-gate)
  tools: []

quality:
  evaluation_ref: "evaluation.md"   # this file covers THIS evaluator's own meta-quality, not the generator's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong component
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 18
  max_token_budget: 6000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
