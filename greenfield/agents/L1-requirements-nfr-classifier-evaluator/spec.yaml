# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-requirements-nfr-classifier-evaluator
  version: "1.0.0"
  layer: L1
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-08-08"

purpose:
  description: "Independently re-checks L1-requirements-nfr-classifier's output against kb-L1-nfr-classification-taxonomy and the real grounding sources, fixes fixable citation/coverage gaps, escalates what isn't."
  input: "L1-requirements-nfr-classifier's original input plus its draft output."
  output: "Scores, findings, any fixes applied, and a final decision."
  business_value: "Letting a generator grade its own homework defeats the point of a quality gate. This agent independently re-derives whether every applicable NFR category was actually checked per FR, whether every non-TBD boundary condition truly has a checkable source, and — critically — whether a TBD the generator left open was actually resolvable from vision.md's Regulatory Posture section or kb-L1-enterprise-security and simply missed."

prompt:
  ref: "prompts/L1-requirements-nfr-classifier-evaluator/instructions.md"
  version: "1.0.0"
  description: "Scores against L1-requirements-nfr-classifier/evaluation.md; independently re-derives category coverage and TBD-resolvability rather than trusting the generator's own confidence fields."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-requirements-nfr-classifier]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The requirements_output and vision_output L1-requirements-nfr-classifier received" }
      generator_output: { type: object, description: "L1-requirements-nfr-classifier's draft items output" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-requirements-nfr-classifier/evaluation.md"   # source of truth for scoring — not duplicated in this agent's prompt
    - kb-L1-nfr-classification-taxonomy   # full six-category method, to re-derive coverage independently rather than trust the generator's own category choices
    - kb-L1-enterprise-security           # re-checked directly — a TBD is only legitimate if this KB genuinely doesn't answer it either
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-nfr-spec-quality-gate   # fires when THIS evaluator concludes; validates L1-requirements-nfr-classifier's RESULTANT output against its own schema + evaluation.md rubric (guardrails/gr-L1-nfr-spec-quality-gate), same "quality gate" pattern as gr-L1-requirements-quality-gate
  tools: []

quality:
  evaluation_ref: "evaluation.md"   # this file covers THIS evaluator's own meta-quality, not the generator's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong classification
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 5500

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
