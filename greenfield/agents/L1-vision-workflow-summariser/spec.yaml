# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-workflow-summariser
  version: "1.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"

purpose:
  description: "Reads every prior agent's output in L1-WF-vision-idea-to-statement and produces a single workflow summary: intent, execution flow, and outcome."
  input: "The outputs of all 4 generator+evaluator pairs in the Phase 0 workflow."
  output: "A workflow-level audit summary, not a new artifact."
  business_value: "Provides a single-point-of-truth for what happened in this workflow run — which agent ran, whether it passed clean or needed a fix or an escalation — without anyone having to reconstruct the story from 8 separate agent logs."

prompt:
  ref: "prompts/L1-vision-workflow-summariser/instructions.md"
  version: "1.0.0"
  description: "Aggregates execution flow and outcome from all Phase 0 agent outputs; does not re-evaluate quality or transform any artifact."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents:
      - L1-vision-idea-intake
      - L1-vision-idea-intake-evaluator
      - L1-vision-market-analyzer
      - L1-vision-market-analyzer-evaluator
      - L1-vision-regulatory-feasibility-checker
      - L1-vision-regulatory-feasibility-checker-evaluator
      - L1-vision-statement-generator
      - L1-vision-statement-generator-evaluator
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      all_step_outputs: { type: array, description: "Ordered list of every generator/evaluator AgentOutput envelope from this workflow run" }

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases: []   # pure aggregation agent — no domain knowledge needed
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
  tools: []

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 10
  max_token_budget: 4000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
