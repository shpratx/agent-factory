purpose:
  description: >
    Domain-agnostic index mapping regulated activity categories to the UK
    body that governs them. Used by L1-vision-regulatory-feasibility-checker
    as the first lookup, regardless of which vertical it's deployed into, to
    identify which body's rules apply before a domain-specific L2 regulatory
    KB (e.g. kb-L2-domain-regulatory) is loaded for the actual
    detailed constraints.

