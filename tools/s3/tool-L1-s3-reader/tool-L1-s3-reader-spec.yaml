spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L1-s3-reader
  version: "1.0.0"
  layer: L1
  owner: agentic-ai-coe

purpose:
  description: "Reads and returns the contents of every file inside a given folder (prefix) of a fixed S3 bucket."
  platform: s3
  operation: read

interface:
  parameters:
    folder_name:
      type: string
      required: true
      description: "Name of the folder (prefix) in the S3 bucket whose files should be read"

  returns:
    type: string
    description: >
      On success: formatted string with header (FILE_SOURCE, BUCKET, FOLDER, FILE_COUNT)
      followed by one "===== FILE: <key> =====" section per object, each with
      LAST_MODIFIED, SIZE_BYTES, and the decoded content (or a skip/error/binary marker).
      On failure: a single "S3_CLIENT_INIT_FAILED / S3_LIST_FAILED / S3_RETRIEVE_FAILED: <detail>" string.

credentials:
  source: secrets-sdk
  path: "s3"
  fields_used: [aws_access_key_id, aws_secret_access_key]

identity:
  tool_id: "tool-L1-s3-reader-001"
  role: tool-executor

  invocable_by:
    roles: [content-generator, orchestrator]
    agents: [any-agent-with-read-permission]

  permissions:
    operation: read
    platform: s3
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/s3"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "folder_name accepted as-is; prefix normalised (leading/trailing slashes stripped, trailing slash re-appended)"
  output_sanitization: "boto3 exceptions caught per-stage (client init, list, per-file read) and returned as a labelled string; raw exception text may appear in the message"
  logging: "No dedicated log file; errors are returned directly to the caller rather than logged separately"
