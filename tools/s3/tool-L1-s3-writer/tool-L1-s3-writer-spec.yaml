spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L1-s3-writer
  version: "1.0.0"
  layer: L1
  owner: agentic-ai-coe

purpose:
  description: "Uploads text content to a fixed S3 bucket under a caller-specified folder, with a UTC timestamp prefixed to the filename to avoid collisions."
  platform: s3
  operation: write

interface:
  parameters:
    folder_name:
      type: string
      required: true
      description: "Name of the folder (prefix) in the S3 bucket to upload into, e.g. 'incoming'"
    file_name:
      type: string
      required: true
      description: "Name of the file to create, e.g. 'report.txt'; reduced to its basename before use"
    contents:
      type: string
      required: true
      description: "Text content to write into the file"

  returns:
    type: object
    fields:
      status: {type: string, description: "'SUCCESS' or 'FAILED'"}
      bucket: {type: string, description: "S3 bucket name (present on success)"}
      key: {type: string, description: "Full object key: <folder>/<timestamp>_<file_name> (present on success)"}
      folder: {type: string, description: "Normalised folder prefix (present on success)"}
      size_bytes: {type: integer, description: "UTF-8 encoded size of contents (present on success)"}
      uploaded_at: {type: string, description: "UTC timestamp YYYYMMDD_HHMMSS (present on success)"}
      reason: {type: string, description: "Failure reason: S3_CLIENT_INIT_FAILED | INVALID_FILE_NAME | S3_UPLOAD_FAILED (present on failure)"}

credentials:
  source: secrets-sdk
  path: "s3"
  fields_used: [aws_access_key_id, aws_secret_access_key]

identity:
  tool_id: "tool-L1-s3-writer-001"
  role: tool-executor

  invocable_by:
    roles: [orchestrator]
    agents: [any-agent-with-write-permission]

  permissions:
    operation: write
    platform: s3
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/s3"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "file_name reduced to basename before use; empty result after stripping rejected with INVALID_FILE_NAME"
  output_sanitization: "boto3 exceptions caught per-stage (client init, upload) and returned as a labelled reason string; raw exception text may appear in the message"
  logging: "No dedicated log file; errors are returned directly to the caller rather than logged separately"
