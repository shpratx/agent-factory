# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-inception-epics-creator-evaluator
  version: "1.0.0"
  layer: L1
  phase: inception
  owner: agentic-ai-coe
  created: "2026-08-28"

purpose:
  description: "Evaluates a candidate L1-epics.json (produced by L1-inception-epics-creator) against its source L1-prd.md and the full Schreiber Foods Jira Epic Best Practices & SOP, scoring it on 8 mandatory rubrics, auto-correcting every fixable issue, and emitting a corrected, schema-compliant epics output plus a final decision."
  input: "folder_name identifying the blob storage location, plus L1-epics.json and L1-prd.md, retrieved exclusively via the attached blob-storage-reader tool (no direct_input or file_upload accepted for this agent)."
  output: "L1-epics.json (the SAME filename the core Epics Creator wrote — overwritten in place) written to blob storage via the attached blob-storage-writer tool. AgentOutput v2 envelope: agent_id, agent_version, execution_id, workflow_execution_id (inherited), status, and content = { type: 'epics', schema_version, items (corrected Epics, same shape as L1-inception-epics-creator's own content.items), evaluation (scores, overall_score, pass, findings, fixes_applied, final_decision: approved | fixed_and_approved | escalate_to_hitl), artifacts, execution_summary }."
  business_value: "Adds an automated quality gate in front of backlog grooming, catching SOP violations, hallucinations, and traceability gaps in generated Epics before they reach Jira — while auto-fixing everything that can be safely corrected from the source documents, and transparently flagging anything that genuinely requires human input rather than guessing."

prompt:
  ref: "prompts/L1-inception-epics-creator-evaluator/instructions.md"
  version: "1.0.0"
  description: "Contains the full L1-inception-epics-creator instruction set (so it can independently re-derive what a correct Epic should look like) plus an evaluator layer that scores 8 rubrics, corrects fixable issues, and issues a final decision."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: output_schema.json"

  input:
    accepts_from_agents: [L1-inception-epics-creator]
    accepts_direct_input: false   # Blob-reader REQUIRED — this evaluator never accepts direct_input.
    accepts_file_upload:
      enabled: false   # Blob-reader REQUIRED — this evaluator never accepts file_upload.
      formats: []
    accepts_blob_storage:
      enabled: true
      required: true
      description: "ONLY accepted ingestion path. Agent calls the attached blob-storage-reader tool once with folder_name + file_names=[\"L1-epics.json\", \"L1-prd.md\"] to fetch both artifacts before evaluating."
    required_documents:
      - L1-epics.json
      - L1-prd.md
    required_parameters:
      folder_name:
        type: string
        description: "Blob storage folder/container path supplied by the user. Used to read the candidate Epics file plus its source PRD, and as the destination folder when writing the evaluated output back to blob storage."

  output:
    $ref: "output_schema.json"

execution_ids:
  workflow_execution_id:
    origin: "inherited"   # inherit from L1-inception-epics-creator.workflow_execution_id
    format: "wf-<uuid>"
    description: "Inherited verbatim from input.inherited_ids.workflow_execution_id (the value L1-inception-epics-creator generated for this pipeline run). This agent never generates its own."
  execution_id:
    origin: "generated"
    format: "exec-<uuid>"
    description: "Newly generated on every execution of this agent."

context:
  knowledge_bases:
    - kb-epics-best-practices   # v1.1. Attached at runtime — same authoritative SOP the core Epics Creator uses; the evaluator applies every rule in this KB (§1-§7 including §2.5 PRD-to-Epic Cardinality Rule) when scoring and correcting.
  tools:
    - blob-storage-reader   # Attached at runtime. Called with (folder_name, file_names=["L1-epics.json", "L1-prd.md"]) to fetch both artifacts in one call.
    - blob-storage-writer   # Attached at runtime. Called with (folder_name, file_name="L1-epics.json", content=<final evaluator output, verbatim>) after evaluation/correction — OVERWRITES the same file the core Epics Creator wrote. Returns blob_storage_url.
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L3-consistency-checker
    - gr-L2-tool-permissions
    - gr-L3-agent-rate-limit
    - gr-L1-impact-assessment-quality-gate   # Fires ONLY on the final successful execution iteration that produces final_decision — never on interim fix-and-recheck passes or failed/retried attempts.

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
