# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-inception-feature-decomposer
  version: "1.0.0"
  layer: L1
  phase: inception
  owner: agentic-ai-coe
  created: 2026-08-05

purpose:
  description: "Decomposes epics into implementation-ready features."
  input: "epics.json produced by the epic-creator agent"
  output: "features.json containing feature items scoped and traceable to their parent epics"
  business_value: "Bridges the gap between coarse-grained business epics and buildable units of work, giving delivery teams a consistent, traceable feature backlog without manual breakdown effort."

prompt:
  ref: "prompts/L1-inception-feature-decomposer/instructions.md"
  version: "1.0.0"
  description: "Reads epics.json and produces a structured, traceable feature backlog with sprint-aware sizing and NFR mapping."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [epic-creator]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".json"]
    required_parameters:
      epics: {type: array, description: "Array of epic objects from epics.json (id, title, description, capability, acceptance_criteria)"}
    optional_parameters:
      max_features_per_epic: {type: integer, default: 6, description: "Upper bound on number of features generated per epic"}
      target_sprint_length_weeks: {type: integer, default: 2, description: "Sprint length used to guide feature sizing"}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-enterprise-architecture
    - kb-L1-features-best-practices
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L3-consistency-checker

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
