spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-inception-requirements-extractor-evaluator
  version: "1.0.0"
  layer: L1
  phase: inception
  owner: agentic-ai-coe
  created: 2026-06-29

purpose:
  description: "Evaluates and fixes PRD output from L1-inception-requirements-extractor against quality rubric, re-uploads corrected artifact"
  input: "AgentOutput from requirements-extractor (with PRD artifact location) + original input for faithfulness checking"
  output: "Evaluation verdict with scores, findings, fixes, and corrected PRD artifact"
  business_value: "Separates generation from evaluation — ensures PRD quality without loading rubric during extraction"

prompt:
  ref: "prompts/L1-inception-requirements-extractor-evaluator/instructions-concise.md"
  version: "1.0.0"

contract:
  input:
    accepts_from_agents: [L1-inception-requirements-extractor]
    accepts_direct_input: true
    required_parameters:
      prd_document: {type: string, description: "PRD markdown content or provided via blob retrieval"}
      extractor_output: {type: object, description: "AgentOutput JSON from the extractor"}
    optional_parameters:
      original_input: {type: string, description: "Raw input given to extractor for faithfulness checking"}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - kb-L1-inception-requirements-extractor-evaluation  # Quality rubric — SOURCE OF TRUTH
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L3-hallucination-detector
    - gr-L3-consistency-checker
  tools:
    - tool-L1-azure-blob-reader
    - tool-L1-azure-blob-writer

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
