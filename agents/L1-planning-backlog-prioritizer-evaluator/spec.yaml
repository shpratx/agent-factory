# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-planning-backlog-prioritizer-evaluator
  version: "1.0.0"
  layer: L1
  phase: planning
  owner: agentic-ai-coe
  created: "2026-08-14"

purpose:
  description: "Independently re-derives and verifies L1-planning-backlog-prioritizer's WSJF/RICE scores, dependency-unblocking scores, rank ordering, and citations — never trusting the generator's own self-check — and pushes corrections back into both the items and the prioritized-backlog.md artifact when it finds an error."
  input: "The generator's full AgentOutput (generator_output) plus the SAME source inputs the generator received (features, dependency_graph, value_scoring_inputs), so every computed value can be re-derived independently rather than compared only against the generator's own claims."
  output: "A verification verdict (approved | fixed_and_approved | rejected) with per-feature findings, any fixes applied, and — if the document itself needed correction — a re-uploaded prioritized-backlog.md at the same artifact location."
  business_value: "Catches silent scoring errors and dependency-order violations before a flawed backlog reaches sprint planning; a wrong priority order is more expensive to unwind after sprints are committed than before."

prompt:
  ref: "prompts/L1-planning-backlog-prioritizer-evaluator/instructions.md"
  version: "1.0.0"
  description: "Re-derives WSJF/RICE scores and dependency-unblocking scores from source data, independently checks rank order against the dependency graph, re-verifies any duplicate_flag claims, and reports a verdict with fixes."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: output_schema.json"   # validates the full AgentOutput envelope (agent_id..status..content), not just content

  input:
    accepts_from_agents: [L1-planning-backlog-prioritizer]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: false
    required_parameters:
      generator_output: {type: object, description: "Full AgentOutput from L1-planning-backlog-prioritizer for this workflow_execution_id."}
      features: {type: array, description: "The same feature list originally given to the generator — needed to independently re-derive scores."}
      dependency_graph: {type: object, description: "The same dependency graph originally given to the generator."}
      value_scoring_inputs: {type: array, description: "The same WSJF/RICE value inputs originally given to the generator."}
    optional_parameters:
      adjacent_backlog_check: {type: boolean, default: false, description: "If the generator set any duplicate_flag values, re-verify them independently via tool-L1-jira-fetch-issue rather than trusting the generator's claim."}

  output:
    $ref: "output_schema.json"

context:
  knowledge_bases:
    - ref: "../L1-planning-backlog-prioritizer/evaluation.md"   # source of truth for scoring — never duplicated into this agent's own prompt
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    # Re-check, independently, the BLOCKER-relevant guardrails the generator owns —
    # never by trusting the generator's own pass/fail claim:
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L1-consistency-check
  tools:
    - tool-L1-jira-fetch-issue   # read-only — independently re-verifies any duplicate_flag the generator claimed

quality:
  evaluation_ref: "evaluation.md"   # THIS agent's own meta-quality bar: are ITS findings and fixes correct — never a restatement of the generator's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong score
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
