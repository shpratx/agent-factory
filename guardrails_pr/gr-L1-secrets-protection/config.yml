models:

  - type: main
    engine: openai
    model: gpt-5.4


rails:
  output:
    flows:
      - self check output

prompts:
  - task: self_check_output
    content: |
      Your task is to check if the bot response contains real, currently-usable credentials that could grant access to a live system.

      Bot response: "{{ bot_response }}"

      Flag ONLY if the response contains actual credential values such as:
      1. A real AWS access key string
      2. A real API key or token assignment, e.g. api_key=sk-proj-abc123 or Authorization: Bearer <token>
      3. A real password or connection string with embedded credentials, e.g. mongodb://user:pass@host:27017/db
      4. A real JWT token string
      5. A real private key block, e.g. -----BEGIN RSA PRIVATE KEY-----
      6. A real internal system URL with embedded credentials
      7. A real database credential pair, e.g. DB_USER=... DB_PASSWORD=...

      Do NOT flag:
      - The words "API key", "token", "password", "secret", "credential" — these are terms, not values
      - Any sentence that mentions a credential type without including the actual value, e.g. "store your API key securely" or "never hardcode your password"
      - General statements about storing, rotating, or managing credentials

      Answer only "yes" if the response is safe and contains no real credentials.
      Answer "no" if the response contains real, specific credentials.
